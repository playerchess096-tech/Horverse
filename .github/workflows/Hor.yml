name: Compila Horror Universe

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Prepara il progetto (accetta anche uno .zip caricato nella radice del repository)
        run: |
          if [ ! -f build.gradle ]; then
            ZIP=$(ls *.zip 2>/dev/null | head -n 1)
            if [ -z "$ZIP" ]; then echo "Nessun build.gradle e nessuno zip trovato"; exit 1; fi
            mkdir -p _proj && unzip -q "$ZIP" -d _proj
            D=$(dirname "$(find _proj -name build.gradle | head -n 1)")
            echo "PROJ=$D" >> "$GITHUB_ENV"
          else
            echo "PROJ=." >> "$GITHUB_ENV"
          fi
      - name: Compila
        working-directory: ${{ env.PROJ }}
        run: gradle build --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: horror-universe-jar
          path: ${{ env.PROJ }}/build/libs/*.jar
